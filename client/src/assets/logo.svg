<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <!-- Ocean Teal Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>

    <!-- Vibrant Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2ecee" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <!-- Deep Navy Gradient -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfe9ec" />
      <stop offset="100%" stop-color="#f6f9fc" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK / ICON -->
  <g transform="translate(15, 10)">
    <!-- Main Fluid Ribbon (S-Curve Body) -->
    <path d="M 65 15 C 35 15, 15 35, 15 65 C 15 95, 45 95, 65 115 C 85 135, 115 115, 115 85 C 115 55, 95 35, 65 15 Z" 
          fill="url(#primaryGrad)" />
    
    <!-- Secondary Dynamic Wave -->
    <path d="M 45 35 C 25 50, 25 80, 50 95 C 70 107, 95 105, 105 80 C 85 95, 50 90, 40 70 C 33 55, 40 40, 45 35 Z" 
          fill="url(#accentGrad)" opacity="0.9" />

    <!-- Neural Network Nodes & Mesh (AI Element) -->
    <g stroke="url(#accentGrad)" stroke-width="2" opacity="0.85">
      <line x1="45" y1="40" x2="65" y2="25" />
      <line x1="65" y1="25" x2="90" y2="40" />
      <line x1="65" y1="25" x2="70" y2="60" />
      <line x1="70" y1="60" x2="90" y2="40" />
      <line x1="70" y1="60" x2="50" y2="80" />
      <line x1="90" y1="40" x2="100" y2="65" />
      <line x1="70" y1="60" x2="100" y2="65" />
    </g>

    <!-- Network Dots -->
    <circle cx="45" cy="40" r="4" fill="#00F5D4" />
    <circle cx="65" cy="25" r="5" fill="#FFFFFF" />
    <circle cx="90" cy="40" r="4.5" fill="#00F5D4" />
    <circle cx="70" cy="60" r="4" fill="#FFFFFF" />
    <circle cx="50" cy="80" r="3.5" fill="#00A896" />
    <circle cx="100" cy="65" r="4.5" fill="#00F5D4" />
  </g>

  <!-- TYPOGRAPHY -->
  <!-- "Shrishti-" -->
  <text x="160" y="78" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="46" 
        font-weight="700" 
        fill="url(#darkGrad)" 
        letter-spacing="-0.5">Shrishti-Jala</text>
  
  
  <!-- Subtitle Tagline -->
  <text x="162" y="108" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#f2f4f5" 
        letter-spacing="6">AI SITE BUILDER</text>
</svg>
